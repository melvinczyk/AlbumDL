<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>AlbumDL</title>
<link rel="icon" type="image/png" href="/static/img/fav.png">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<img id="bg" src="/static/img/bg.gif" alt="">
<div id="toasts" aria-live="polite"></div>

<div class="wrap">
  <header class="top">
    <div class="brand"><img class="t" src="/static/img/fav.png" alt=""><img class="l" src="/static/img/logo.png" alt="albumdl"></div>
    <div class="status" id="status" title="Live status">
      <i class="led warn" id="led"></i><b id="sMain">Connecting…</b>
      <span id="sTracks"></span><span id="sWritten"></span><span id="sDisk"></span>
    </div>
  </header>

  <nav role="tablist">
    <button role="tab" data-view="discover" aria-selected="true"><span class="pi search"></span>Discover</button>
    <button role="tab" data-view="queue" aria-selected="false"><span class="pi download"></span>Queue <span class="badge blue" id="bQueue" hidden>0</span></button>
    <button role="tab" data-view="console" aria-selected="false"><span class="pi console"></span>Console <span class="badge" id="bLog" hidden>0</span></button>
  </nav>

  <main class="view active" id="v-discover">
    <form class="panel" id="searchForm" autocomplete="off">
      <div class="search">
        <label>Artist<input type="text" id="artist"></label>
        <label>Album<input type="text" id="album" placeholder="optional, or paste a MusicBrainz link"></label>
        <button class="btn go" id="searchBtn" type="submit"><span class="pi search k"></span>Search</button>
      </div>
    </form>
    <div id="searchMsg" style="margin-top:12px"></div>
    <div class="stack" style="margin-top:14px">
      <div id="artistInfo"></div>
      <div id="results"></div>
      <div id="detail"></div>
    </div>
  </main>

  <main class="view" id="v-queue">
    <div class="head"><h2>Downloads</h2><span class="counts" id="queueCounts"></span><button class="btn sm push" id="clearBtn" type="button">Clear finished</button></div>
    <div id="batches" class="stack" style="margin-top:14px"></div>
    <div class="jobgrid" id="jobs"></div>
    <div id="jobDetail" style="margin-top:14px"></div>
  </main>

  <main class="view" id="v-console">
    <div class="panel">
      <div class="row" style="margin-bottom:10px">
        <span id="lvls" class="row" style="gap:5px"></span>
        <select id="fSrc" aria-label="Source"><option value="">All sources</option></select>
        <input type="text" id="fText" placeholder="Filter…" style="min-width:150px">
        <span class="counts" id="logCounts" style="margin-left:auto"></span>
        <button class="btn sm ghost" id="followBtn" type="button">Following</button>
        <button class="btn sm ghost" id="copyBtn" type="button">Copy</button>
        <button class="btn sm ghost" id="saveBtn" type="button">Save</button>
        <button class="btn sm bad" id="wipeBtn" type="button">Clear</button>
      </div>
      <div id="term" role="log" aria-live="off" tabindex="0"></div>
    </div>
  </main>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
