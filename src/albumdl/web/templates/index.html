<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>AlbumDL</title>
<link rel="icon" type="image/png" href="/static/img/fav.png">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<picture id="bg">
  <source media="(max-width: 720px), (prefers-reduced-motion: reduce)" srcset="/static/img/bg.png">
  <img src="/static/img/bg.gif" alt="">
</picture>
<div id="veil"></div>
<div id="toasts" aria-live="polite"></div>

<div class="wrap">
  <header class="top">
    <div class="brand"><img class="t" src="/static/img/fav.png" alt=""><img class="l" src="/static/img/logo.png" alt="AlbumDL"></div>
    <button class="pill" id="pill" type="button" data-view="queue"><i class="led" id="led"></i><span id="pillText">Idle</span></button>
  </header>

  <nav id="nav">
    <button data-view="search" aria-selected="true"><span class="pi search"></span><b>Search</b></button>
    <button data-view="library" aria-selected="false"><span class="pi folder"></span><b>Library</b></button>
    <button data-view="queue" aria-selected="false"><span class="pi download"></span><b>Queue</b><em class="badge" id="bQueue" hidden>0</em></button>
    <button data-view="log" aria-selected="false"><span class="pi console"></span><b>Log</b><em class="badge bad" id="bLog" hidden>0</em></button>
  </nav>

  <main class="view active" id="v-search">
    <form class="find" id="searchForm" autocomplete="off">
      <span class="pi search c"></span>
      <input type="text" id="q" placeholder="Artist, Artist - Album, or a link" enterkeyhint="search" aria-label="Search">
      <button class="btn go" id="searchBtn" type="submit">Search</button>
    </form>
    <div id="artistBar"></div>
    <div id="similar"></div>
    <div id="results"><div class="howto">
      <div><b>Artist</b><span>Title Fight</span></div>
      <div><b>Album</b><span>Title Fight - Kingston, or just Title Fight Kingston</span></div>
      <div><b>Link</b><span>A MusicBrainz or YouTube link. A YouTube playlist or video imports unofficial music, like game soundtracks or full-album uploads.</span></div>
    </div></div>
  </main>

  <main class="view" id="v-library">
    <div class="logbar">
      <input type="text" id="libFilter" placeholder="Filter albums" aria-label="Filter albums">
      <button class="btn sm ghost" id="coversBtn" type="button">Find missing covers</button>
    </div>
    <div id="libEdit" hidden></div>
    <div class="alts" id="libChips"></div>
    <p class="sub" id="libSum"></p>
    <div id="libList"></div>
  </main>

  <main class="view" id="v-queue">
    <div id="batches"></div>
    <div id="jobs"></div>
    <p class="foot" id="stats"></p>
  </main>

  <main class="view" id="v-log">
    <div class="logbar">
      <div class="seg" id="lvls"></div>
      <input type="text" id="fText" placeholder="Filter" aria-label="Filter log">
      <button class="btn sm ghost" id="copyBtn" type="button">Copy</button>
      <button class="btn sm ghost" id="wipeBtn" type="button">Clear</button>
    </div>
    <div id="term" role="log" aria-live="off" tabindex="0"></div>
    <button class="btn sm hot" id="latestBtn" type="button" hidden>Latest</button>
  </main>
</div>

<div class="actions" id="actions" hidden>
  <div id="edRow" hidden><span>Edition</span><select id="edSel" aria-label="Edition"></select></div>
  <span id="actionText"></span>
  <button class="btn ghost" id="clearSel" type="button">Clear</button>
  <button class="btn hot" id="retryBtn" type="button" hidden>Retry</button>
  <button class="btn hot" id="linkBtn" type="button" hidden>Link tracks</button>
  <button class="btn" id="editBtn" type="button" hidden>Edit tags</button>
  <button class="btn ghost danger" id="delBtn" type="button" hidden>Delete</button>
  <button class="btn go" id="dlBtn" type="button"><span class="pi download k"></span><span id="dlLabel">Download</span></button>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
